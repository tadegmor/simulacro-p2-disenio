{id:'R17',t:'arq',s:'N',q:'En el Proceso Unificado, ¿a qué modelo pertenece la vista de despliegue de la arquitectura?',o:['Al modelo de diseño','Al modelo de análisis','Al modelo de casos de uso','Al modelo de datos'],a:[0],e:'Muestra la distribución física: nodos, dispositivos y vínculos, en un diagrama de despliegue.',f:'U5.5 · Arquitectura en el Proceso Unificado'},
{id:'R18',t:'arq',s:'N',q:'En MVC, ¿qué elemento gestiona las solicitudes del usuario y selecciona el comportamiento del modelo y la vista?',o:['El controlador','El modelo','La vista','El mediador'],a:[0],e:'El modelo encapsula funcionalidad, contenido y estado; la vista prepara y presenta los datos.',f:'U5.5 · MVC'},
{id:'R19',t:'arq',s:'N',q:'¿Qué caracteriza a una arquitectura monolítica frente a una distribuida?',o:['Una sola unidad de despliegue, frente a servicios independientes comunicados por red.','Muchos servicios independientes, frente a una sola unidad de despliegue en memoria.','Una base de datos por servicio, frente a una base compartida por todos los servicios.','Comunicación mediante API/REST, frente a llamadas internas dentro del mismo proceso.'],a:[0],e:'Lo distribuido suma complejidad de red, y por eso hay que tener en cuenta las 8 falacias.',f:'U5.5 · Monolítico vs. distribuido'},
{id:'R20',t:'arq',s:'N',m:1,q:'Según el apunte, ¿qué actividades forman parte de diseñar la arquitectura?',o:['Identificar nodos de procesamiento y sus configuraciones de red.','Descomponer el sistema en capas y subsistemas con sus interfaces.','Identificar mecanismos generales, como persistencia o distribución.','Evaluar el uso de software de terceros, como librerías o frameworks.','Escribir los casos de prueba de aceptación con el cliente.'],a:[0,1,2,3],e:'Los criterios de aceptación pertenecen a la Unidad 6.',f:'U5.5 · Diseñar la arquitectura'},

/* ---------- U6 · Fundamentos y debugging ---------- */
{id:'U01',t:'pru',s:'N',q:'Según el apunte, probar es:',o:['Ejecutar un programa con la intención de encontrar errores.','Demostrar que en el programa no quedan errores.','Mostrar que el programa realiza bien sus funciones.','Lograr confiar en que el programa hará lo esperado.'],a:[0],e:'Las otras tres son las definiciones que el apunte marca como incorrectas. Es una actividad destructiva.',f:'U6.1 · ¿Qué significa probar? (diap. 11)'},
{id:'U02',t:'pru',s:'N',q:'Un caso de prueba exitoso es el que:',o:['Descubre un error.','Pasa sin errores.','Cubre todo el código.','Ejecuta sin interrupciones.'],a:[0],e:'Un caso exitoso es el que encuentra un error: cada error hallado es un costo evitado después.',f:'U6.1 · diap. 11 y 12'},
{id:'U03',t:'pru',s:'N',q:'Un programador interpreta mal la especificación, escribe a + b sin prever el desbordamiento y un isósceles válido termina rechazado. ¿Qué es cada cosa, en ese orden?',o:['Error, defecto y falla.','Defecto, error y falla.','Falla, defecto y error.','Error, falla y defecto.'],a:[0],e:'Error: equivocación de una persona. Defecto: está en el código o el diseño. Falla: se observa al ejecutar.',f:'U6.1 · Error, defecto y falla (diap. 13)'},
{id:'U04',t:'pru',s:'N',m:1,q:'¿Qué debe incluir un caso de prueba?',o:['Las entradas.','Las condiciones de ejecución.','El resultado esperado.','La corrección del defecto.'],a:[0,1,2],e:'Sin resultado esperado no se puede decidir si hubo falla.',f:'U6.1 · diap. 13'},
{id:'U05',t:'pru',s:'N',m:1,q:'¿Cuáles de estos son principios de la prueba?',o:['Evitar que el autor pruebe su propio programa.','Probar también entradas inválidas e inesperadas.','Verificar también lo que el programa no debe hacer.','Descartar cada caso de prueba después de ejecutarlo.'],a:[0,1,2],e:'Hay que evitar los casos desechables: se conservan y automatizan como inversión para la regresión.',f:'U6.1 · Principios (diap. 15 y 16)'},
{id:'U06',t:'pru',s:'N',q:'En un módulo ya se encontraron muchos errores. Según los principios de la prueba:',o:['Es más probable que queden otros errores allí.','Es menos probable que queden otros errores allí.','Ya se pueden dar por terminadas las pruebas.','La cantidad encontrada no dice nada al respecto.'],a:[0],e:'Principio 9: los errores se agrupan.',f:'U6.1 · Principios (diap. 16)'},
{id:'U07',t:'pru',s:'N',q:'¿Cuál es el objetivo de una inspección de software?',o:['Encontrar errores, no soluciones: la corrección se decide después.','Encontrar errores y corregirlos durante la misma reunión del equipo.','Evaluar el desempeño del programador en base a los errores hallados.','Ejecutar el programa con datos reales antes de las pruebas de sistema.'],a:[0],e:'Es una lectura o inspección visual del programa hecha por un equipo. Sirve además como feedback y aprendizaje.',f:'U6.1 · Inspecciones y revisiones (diap. 17)'},
{id:'U08',t:'pru',s:'N',q:'«Las pruebas pueden mostrar la presencia de errores, pero nunca su ausencia». ¿Qué implica esa frase de Dijkstra?',o:['Que una corrida sin fallas no demuestra que el programa esté libre de errores.','Que alcanza con una prueba exhaustiva para garantizar la ausencia de errores.','Que no conviene probar, porque nunca se llegará a encontrar todos los errores.','Que solo las pruebas de caja blanca permiten mostrar la ausencia de errores.'],a:[0],e:'La prueba exhaustiva es imposible: hay que elegir bien los casos, pero no se puede demostrar ausencia.',f:'U6.1 · diap. 12 y 14'},
{id:'U09',t:'pru',s:'N',q:'¿Cuál es la diferencia entre probar y depurar?',o:['Probar detecta errores; depurar determina su ubicación y los corrige.','Probar corrige errores; depurar detecta que hay errores en el programa.','Probar lo hace siempre el autor; depurar lo hace siempre otra persona.','No hay diferencia: son dos nombres de la misma actividad de calidad.'],a:[0],e:'La depuración tiene dos pasos: determinar la naturaleza y ubicación del error, y corregirlo.',f:'Myers · Depuración; Resumen 2016'},
{id:'U10',t:'pru',s:'N',q:'¿Qué inconveniente tiene depurar por esparcimiento de sentencias, como agregar prints por todo el programa?',o:['Cambia el código y puede enmascarar el error.','Requiere siempre un depurador integrado.','Solo se puede usar en programas muy chicos.','Corrige el síntoma sin que se pueda evitar.'],a:[0],e:'Es un método de fuerza bruta: conviene usarlo solo como suplemento de los métodos sistemáticos.',f:'Myers · Depuración; Resumen 2016'},
{id:'U11',t:'pru',s:'N',q:'¿Cómo razonan los métodos de depuración por inducción y por deducción?',o:['Inducción: de los síntomas a una hipótesis general. Deducción: de las causas posibles, eliminando hasta una.','Inducción: de las causas posibles, eliminando hasta una. Deducción: de los síntomas a una hipótesis general.','Inducción: se vuelca la memoria y se analiza. Deducción: se agregan sentencias de impresión en todo el código.','Inducción: se rastrea hacia atrás desde el error. Deducción: se rastrea hacia adelante desde el inicio del programa.'],a:[0],e:'Inducción va de lo particular a lo general; deducción, de lo general a lo particular.',f:'Myers · Depuración; Resumen 2016'},
{id:'U12',t:'pru',s:'N',m:1,q:'¿Cuáles son principios de reparación de errores al depurar?',o:['Donde hay una falla, probablemente haya otra.','Arreglar el error y no solo un síntoma.','La corrección puede producir nuevos errores.','Una corrección siempre es 100 % segura.'],a:[0,1,2],e:'La probabilidad de que una corrección sea correcta baja en los programas grandes.',f:'Myers · Depuración; Resumen 2016'},

/* ---------- U6 · Caja negra ---------- */
{id:'N01',t:'cn',s:'N',m:1,q:'¿Cuáles son técnicas de caja negra?',o:['Particiones de equivalencia','Análisis de valores límite','Conjetura de errores','Cobertura de decisiones','Cobertura de sentencias'],a:[0,1,2],e:'Las coberturas lógicas son técnicas de caja blanca.',f:'U6.1 · Diseño de casos de prueba (diap. 19)'},
{id:'N02',t:'cn',s:'N',q:'«La cantidad de ítems debe estar entre 1 y 999». ¿Cuántas clases de equivalencia surgen?',o:['1 válida y 2 inválidas','2 válidas y 1 inválida','1 válida y 1 inválida','999 válidas y 2 inválidas'],a:[0],e:'Para un rango de valores: una clase válida, y dos inválidas (por debajo y por encima).',f:'U6.1 · Cómo identificar las clases (diap. 23)'},
{id:'N03',t:'cn',s:'N',q:'«Tipo de libro: cartón, cartulina o tela», y el programa trata distinto a cada uno. ¿Cuántas clases surgen?',o:['3 válidas y 1 inválida','1 válida y 2 inválidas','3 válidas y 3 inválidas','1 válida y 1 inválida'],a:[0],e:'Conjunto de valores tratados de forma distinta: una clase válida por valor, y una inválida.',f:'U6.1 · Cómo identificar las clases (diap. 23)'},
{id:'N04',t:'cn',s:'N',q:'«El primer carácter debe ser una letra». ¿Cuántas clases surgen?',o:['1 válida y 1 inválida','1 válida y 2 inválidas','2 válidas y 1 inválida','26 válidas y 1 inválida'],a:[0],e:'Una condición «debe ser» da una clase válida y una inválida.',f:'U6.1 · Cómo identificar las clases (diap. 23)'},
{id:'N05',t:'cn',s:'N',q:'¿Por qué es incorrecto el caso de prueba (tipo = XXX, cantidad = 0)?',o:['Cubre dos clases inválidas a la vez: si el programa sale por el tipo, nunca prueba la cantidad.','Cubre dos clases válidas a la vez: se pierde la oportunidad de probarlas en casos separados.','No incluye el valor de borde superior: siempre hay que probar 999 junto con otro inválido.','Es un caso de caja blanca: sus valores deberían derivar de la especificación del programa.'],a:[0],e:'Cada caso inválido cubre una y solo una clase inválida, con el resto de los datos válidos.',f:'U6.1 · Una sola clase inválida por caso (diap. 24)'},
{id:'N06',t:'cn',s:'N',q:'¿Cómo se arman los casos a partir de las clases de equivalencia?',o:['Los válidos combinan clases no cubiertas; los inválidos cubren una clase por caso.','Los válidos cubren una clase por caso; los inválidos combinan todas las clases posibles.','Tanto los válidos como los inválidos cubren una sola clase por caso, sin excepciones.','Tanto los válidos como los inválidos combinan todas las clases que se pueda en un caso.'],a:[0],e:'Es el procedimiento paso a paso del apunte.',f:'U6.1 · Procedimiento (diap. 22)'},
{id:'N07',t:'cn',s:'N',q:'Dominio de 1 a 255. ¿Qué valores se prueban con análisis de valores límite?',o:['0, 1, 255 y 256','1, 128 y 255','1 y 255','0 y 256'],a:[0],e:'Dos valores en el borde y dos inmediatamente fuera.',f:'U6.1 · Valores límite (diap. 27 y 28)'},
{id:'N08',t:'cn',s:'N',q:'Un módulo lee un archivo de 1 a 10.000 registros. ¿Qué conjunto aplica correctamente valores límite?',o:['0, 1, 10.000 y 10.001 registros','1, 500, 1.000 y 1.001 registros','0, 1, 500 y 1.000 registros','5.000 y 10.000 registros'],a:[0],e:'Se prueban los extremos y justo más allá de ellos. Puede sumarse un valor intermedio representativo.',f:'U6.1 · Valores límite; banco de preguntas'},
{id:'N09',t:'cn',s:'N',q:'Dominio de -1,0 a 1,0 con tres decimales. ¿Qué valores de borde y fuera de borde corresponden?',o:['-1,001; -1,0; 1,0 y 1,001','-1,0; 0,0 y 1,0','-2,0; -1,0; 1,0 y 2,0','-1,0 y 1,0'],a:[0],e:'Dos valores en el borde y dos inmediatamente fuera, según la precisión del dato.',f:'U6.1 · Valores límite: ejemplos (diap. 28)'},
{id:'N10',t:'cn',s:'N',q:'Una contribución mensual se calcula entre $0 y $500.000. ¿Qué dice valores límite respecto de ese resultado?',o:['Los límites también se buscan en la salida: casos que den $0, $500.000, negativa y mayor al tope.','Solo se aplican a las entradas: la salida se verifica únicamente con un valor representativo.','Solo se aplican a las salidas: las entradas deben cubrirse con particiones de equivalencia.','No se aplican a importes: los límites solo tienen sentido para valores enteros sin decimales.'],a:[0],e:'Cada margen de cada clase debe probarse, tanto de entrada como de salida.',f:'U6.1 · Valores límite: ejemplos (diap. 28)'},
{id:'N11',t:'cn',s:'N',q:'Cotizador: peso liviano o pesado; servicio Estándar, Express o Económico; un único rango de CP. ¿Cuál es la mínima cantidad de casos válidos que cubre todas las clases válidas?',o:['3','2','6','11'],a:[0],e:'Se combinan clases en cada caso. El mínimo lo impone el servicio, con 3 clases válidas.',f:'U6.1 · Práctica del cotizador (diap. 39)'},
{id:'N12',t:'cn',s:'N',q:'Cotizador: pesado $6.000, Express × 1,5. ¿Cuál es la salida esperada para (12,0 kg; Express; 1425)?',o:['Costo: $9.000','Costo: $4.800','Costo: $6.000','Costo: $4.500'],a:[0],e:'$6.000 × 1,5 = $9.000. El resultado esperado es parte del caso.',f:'U6.1 · Práctica del cotizador (diap. 39)'},
{id:'N13',t:'cn',s:'N',q:'En el cotizador, ¿por qué se subdivide la clase válida del peso en liviano y pesado?',o:['Porque el programa trata distinto a esos elementos: cambia la tarifa base.','Porque toda clase válida de un rango debe dividirse siempre en dos mitades.','Porque así se evita tener que probar los valores límite de esa condición.','Porque un peso de más de 5,0 kg es inválido para el servicio Económico.'],a:[0],e:'Se subdivide una clase cuando el programa trata distinto a algunos de sus elementos.',f:'U6.1 · diap. 23 y 38'},
{id:'N14',t:'cn',s:'N',m:1,q:'Se prueba una función que clasifica una lista. Con conjetura de errores, ¿qué casos conviene incluir?',o:['La lista está vacía.','Contiene una sola entrada.','Todos los datos tienen el mismo valor.','Ya está clasificada.'],a:[0,1,2,3],e:'Son los cuatro casos del ejemplo de la cátedra: «sospechosos habituales» por experiencia.',f:'U6.1 · Conjetura de errores (diap. 29)'},
{id:'N15',t:'cn',s:'N',q:'En el programa de triángulos, ¿qué resultado se espera para (2, 2, 4)?',o:['No forman un triángulo','Triángulo isósceles','Triángulo escaleno','Formato inválido'],a:[0],e:'Es el isósceles degenerado: 2a = c, por lo que no cumple la desigualdad triangular.',f:'U6.1 · Casos del triángulo (diap. 5)'},
{id:'N16',t:'cn',s:'N',m:1,q:'¿Qué propiedades tiene un buen caso de prueba?',o:['Reduce el número de otros casos que deben idearse.','Cubre un conjunto extenso de otros casos posibles.','Tiene una probabilidad razonable de encontrar errores.','Se elige al azar para evitar sesgos del probador.'],a:[0,1,2],e:'Diseñar casos al azar es una metodología muy pobre en resultados.',f:'U6.1 · Un buen caso de prueba (diap. 19 y 20)'},

/* ---------- U6 · Caja blanca ---------- */
{id:'W01',t:'cb',s:'N',q:'Con x = 1 se ejecutan todas las líneas de este método. ¿Qué cobertura se alcanza?',c:'void evaluar(int x) {\n    if (x > 0) {\n        Console.WriteLine("Positivo");\n    }\n    Console.WriteLine("Fin");\n}',o:['100 % de sentencias, pero no de decisiones: nunca se probó x ≤ 0.','100 % de decisiones, pero no de sentencias: nunca se probó x ≤ 0.','100 % de sentencias y de decisiones, porque todo el código se ejecutó.','Ninguna, porque se necesitan al menos dos casos para medir cobertura.'],a:[0],e:'Una prueba de cobertura de sentencias es débil.',f:'U6.1 · Cobertura de sentencias (diap. 30)'},
{id:'W02',t:'cb',s:'N',q:'¿Qué exige la cobertura de decisiones?',o:['Que cada decisión lógica tome los valores verdadero y falso al menos una vez.','Que cada línea de código se ejecute al menos una vez, sin mirar sus ramas.','Que cada condición individual tome verdadero y falso, sin mirar la decisión.','Que se recorran todos los caminos posibles del programa, sin excepción.'],a:[0],e:'Incluye a la cobertura de sentencias.',f:'U6.1 · Cobertura de decisiones (diap. 31)'},
{id:'W03',t:'cb',s:'N',q:'Para if (a > 0 || b > 0) se usan los casos (1, -1) y (-1, 1). ¿Qué se logra?',o:['Cobertura de condiciones, pero no de decisiones: nunca se probó la rama falsa.','Cobertura de decisiones, pero no de condiciones: nunca se probó a > 0 falsa.','Cobertura de condición/decisión, porque cada condición tomó ambos valores.','Ninguna de las coberturas, porque la decisión siempre fue verdadera.'],a:[0],e:'Cada condición tomó V y F, pero la decisión fue siempre verdadera.',f:'U6.1 · Cobertura de condiciones (diap. 33)'},
{id:'W04',t:'cb',s:'N',q:'Para if (a > 0 || b > 0), ¿qué par de casos alcanza cobertura de condición/decisión?',o:['(1, 1) y (-1, -1)','(1, -1) y (-1, 1)','(1, 1) y (1, -1)','(-1, 1) y (-1, -1)'],a:[0],e:'Cada condición toma V y F, y la decisión también.',f:'U6.1 · Comparando los criterios (diap. 34)'},
{id:'W05',t:'cb',s:'N',q:'¿Cuál es el criterio de cobertura lógica más débil?',o:['Sentencias','Decisiones','Condiciones','Condición/decisión'],a:[0],e:'Condición/decisión incluye a decisiones y condiciones; decisiones incluye a sentencias.',f:'U6.1 · Comparando los criterios (diap. 34)'},
{id:'W06',t:'cb',s:'N',q:'Un equipo alcanzó 100 % de cobertura. ¿Qué se puede concluir?',o:['No prueba que no falte funcionalidad: se combina con técnicas de caja negra.','El programa ya no tiene errores, y se pueden terminar las pruebas del módulo.','Se cumplió la especificación completa, porque se ejecutó todo el código escrito.','Las pruebas de sistema y de aceptación ya no son necesarias para este módulo.'],a:[0],e:'Lo que no se programó no se puede cubrir. Por eso las estrategias se combinan.',f:'U6.1 · Comparando los criterios (diap. 34)'},
{id:'W07',t:'cb',s:'N',q:'Para if (a > 0 && b > 0) se usan (a=1, b=1) y (a=-1, b=1). ¿Qué se logra?',o:['Cobertura de decisiones, pero b > 0 nunca tomó el valor falso.','Cobertura de condiciones, pero la decisión nunca tomó el valor falso.','Cobertura de condición/decisión, porque la decisión tomó V y F.','Ninguna cobertura, porque hay dos condiciones y solo dos casos.'],a:[0],e:'La decisión tomó V y F: decisiones al 100 %. Para condiciones falta que b > 0 sea falsa.',f:'U6.1 · Cobertura de decisiones (diap. 32)'},
{id:'W08',t:'cb',s:'N',q:'Los 14 casos del triángulo pasan, pero (2147483647, 2147483647, 1) se rechaza. ¿Cuál es la causa?',o:['a + b se desborda en int y da un resultado negativo.','Los lados iguales no se detectan con números grandes.','El archivo de entrada no admite valores tan largos.','El orden de los lados altera la clasificación.'],a:[0],e:'La suma de dos valores válidos produce un resultado inválido. Se corrige promoviendo a long antes de sumar.',f:'U6.1 · Un defecto que los 14 casos no ven (diap. 10)'},
{id:'W09',t:'cb',s:'N',q:'¿De dónde se derivan los casos de prueba en cada estrategia?',o:['Caja negra: de la especificación. Caja blanca: de la estructura interna del programa.','Caja negra: de la estructura interna del programa. Caja blanca: de la especificación.','Caja negra: de los datos de producción. Caja blanca: de los resultados de los usuarios.','Ambas: de la estructura interna del programa, aunque con distintos criterios de cobertura.'],a:[0],e:'No es que una sea mejor: se combinan.',f:'U6.1 · Caja negra y caja blanca (diap. 18)'},

/* ---------- U6 · Unidad e integración ---------- */
{id:'I01',t:'niv',s:'N',q:'En el modelo en V, ¿con qué etapa se contrasta cada nivel de prueba?',o:['Aceptación con requisitos del usuario; sistema con objetivos; integración con diseño de módulos.','Aceptación con objetivos; sistema con diseño de módulos; integración con requisitos del usuario.','Aceptación con diseño de módulos; sistema con requisitos del usuario; integración con objetivos.','Aceptación con codificación; sistema con requisitos del usuario; integración con objetivos.'],a:[0],e:'Las pruebas de unidad se contrastan con la codificación.',f:'U6.2 · El modelo en V (diap. 4)'},
{id:'I02',t:'niv',s:'N',m:1,q:'Según FIRST, una buena prueba de unidad debe ser:',o:['Fast (rápida)','Independent (independiente)','Repeatable (repetible)','Self-validating (se autoevalúa)','Exhaustive (exhaustiva)'],a:[0,1,2,3],e:'La T es Timely (a tiempo). La prueba exhaustiva es imposible.',f:'U6.2 · Una buena prueba de unidad (diap. 6)'},
{id:'I03',t:'niv',s:'N',q:'¿Cuál es la estructura de una prueba de unidad con [Fact]?',o:['Arrange, Act, Assert','Act, Arrange, Assert','Assert, Act, Arrange','Arrange, Assert, Act'],a:[0],e:'Preparar el objeto y los datos, ejecutar la unidad y verificar el resultado.',f:'U6.2 · Ejemplo con [Fact] (diap. 7)'},
{id:'I04',t:'niv',s:'N',q:'¿Cuál es la diferencia entre un stub y un mock?',o:['El stub devuelve datos preparados; el mock además verifica cómo fue usado.','El mock devuelve datos preparados; el stub además verifica cómo fue usado.','El stub reemplaza a la unidad bajo prueba; el mock reemplaza a un usuario.','No hay diferencia: son dos nombres para la misma dependencia real de prueba.'],a:[0],e:'Ambos son dobles de prueba que reemplazan una dependencia real.',f:'U6.2 · Mocks y stubs (diap. 9)'},
{id:'I05',t:'niv',s:'N',q:'Según la pirámide de pruebas, ¿cómo debería ser la cantidad de pruebas?',o:['Muchas de unidad, algunas de integración y pocas de extremo a extremo.','Muchas de extremo a extremo, algunas de integración y pocas de unidad.','Muchas de integración, y una cantidad igual de unidad y extremo a extremo.','La misma cantidad en cada nivel, para no descuidar ninguno de los tres.'],a:[0],e:'Hacia arriba crecen el costo, el tiempo y la fragilidad. La pirámide invertida hace lento y caro cada cambio.',f:'U6.2 · Pirámide de pruebas (diap. 10)'},
{id:'I06',t:'niv',s:'N',q:'En una integración incremental, AB y ABC pasan, y al probar ABCD aparece una falla. ¿Quién es el primer sospechoso?',o:['D','A','C','Todos por igual'],a:[0],e:'La falla apunta al último módulo agregado. Esa es la ventaja frente al big-bang.',f:'U6.2 · Ejemplo incremental (diap. 14)'},
{id:'I07',t:'niv',s:'N',q:'¿Qué simula cada elemento en las pruebas de integración?',o:['El driver simula al llamador; el stub simula al módulo llamado.','El driver simula al módulo llamado; el stub simula al llamador.','El driver y el stub simulan al usuario final del programa.','El driver simula la base de datos; el stub simula la red.'],a:[0],e:'Descendente usa stubs; ascendente usa drivers.',f:'U6.2 · Descendente y ascendente (diap. 15)'},
{id:'I08',t:'niv',s:'N',q:'Se empieza a integrar por el módulo superior y se bajan niveles, simulando lo que falta. ¿Qué estrategia es y qué necesita?',o:['Descendente; necesita stubs.','Descendente; necesita drivers.','Ascendente; necesita stubs.','Ascendente; necesita drivers.'],a:[0],e:'Prueba temprano la lógica de control, aunque los stubs pueden ser complejos.',f:'U6.2 · Descendente y ascendente (diap. 15)'},
{id:'I09',t:'niv',s:'N',q:'¿Cuál es una desventaja de la integración ascendente (bottom-up)?',o:['El programa completo recién existe al final.','Requiere construir stubs muy complejos.','Los módulos base casi no se llegan a probar.','La lógica de control se prueba antes que todo.'],a:[0],e:'A cambio, no requiere stubs y prueba a fondo los módulos base.',f:'U6.2 · Descendente y ascendente (diap. 15)'},
{id:'I10',t:'niv',s:'N',q:'¿Cuál es la principal dificultad de la integración no incremental (big-bang)?',o:['Si falla al combinar, cuesta saber qué módulo es el culpable.','No permite probar los módulos por separado ni en paralelo.','Obliga a que los primeros módulos se prueben más veces.','Solo funciona si no se utilizan drivers ni stubs en absoluto.'],a:[0],e:'En general se prefiere la prueba incremental.',f:'U6.2 · Incremental vs. no incremental (diap. 12 y 13)'},
{id:'I11',t:'niv',s:'N',m:1,q:'¿Qué tipo de problemas buscan las pruebas de integración?',o:['Contratos de datos que no coinciden.','Llamadas en secuencia incorrecta.','Timeouts y reintentos mal tratados.','Permisos y versiones mal configurados.','Si el usuario final acepta el sistema.'],a:[0,1,2,3],e:'La decisión de aceptar el sistema corresponde a la prueba de aceptación.',f:'U6.2 · Pruebas de integración (diap. 11)'},
{id:'I12',t:'niv',s:'N',q:'Un caso se describe como «prueba de integración, de regresión, diseñada con valores límite». ¿Qué indica cada término?',o:['Nivel, tipo y técnica.','Tipo, técnica y nivel.','Técnica, nivel y tipo.','Nivel, técnica y tipo.'],a:[0],e:'Nivel: ¿sobre qué alcance? Tipo: ¿qué atributo? Técnica: ¿cómo se diseñan los casos?',f:'U6.2 · Niveles, tipos y técnicas (diap. 3)'},

/* ---------- U6 · Funcional, humo, regresión y sistema ---------- */
{id:'Y01',t:'tip',s:'S',q:'En cada despliegue se verifica rápido que la app abra, que el login funcione y que se pueda buscar un producto. ¿Qué prueba es?',o:['Humo','Regresión','Volumen','Aceptación'],a:[0],e:'Es un conjunto mínimo, amplio y superficial. Evita perder tiempo probando en detalle un sistema que no arranca.',f:'U6.2 · Humo (diap. 19; solución diap. 39)'},
{id:'Y02',t:'tip',s:'N',q:'Tras corregir el cálculo del descuento, se vuelven a ejecutar las pruebas de todo el carrito. ¿Qué prueba es?',o:['Regresión','Humo','Esfuerzo','Integración'],a:[0],e:'Verifica que un cambio no rompió lo que antes funcionaba.',f:'U6.2 · Solución (diap. 39)'},
{id:'Y03',t:'tip',s:'N',q:'Con JMeter se simulan 5.000 usuarios iniciando sesión en un minuto. ¿Qué prueba es?',o:['Esfuerzo','Volumen','Facilidad de uso','Instalación'],a:[0],e:'Es un pico de carga en poco tiempo. Sería performance si hubiera un tiempo objetivo.',f:'U6.2 · Solución (diap. 39)'},
{id:'Y04',t:'tip',s:'N',q:'Se carga una base con 20 millones de huéspedes para ver si el sistema sigue funcionando. ¿Qué prueba es?',o:['Volumen','Esfuerzo','Regresión','Performance'],a:[0],e:'Lo que se aumenta es la cantidad de datos.',f:'U6.2 · Solución (diap. 39)'},
{id:'Y05',t:'tip',s:'N',q:'Con 500 usuarios, la respuesta debe llegar en menos de 2 segundos. ¿Qué prueba verifica ese objetivo?',o:['Performance','Esfuerzo','Volumen','Seguridad'],a:[0],e:'Con la carga prevista, comprueba si se cumplen los tiempos objetivo.',f:'U6.2 · Volumen, esfuerzo y performance (diap. 27)'},
{id:'Y06',t:'tip',s:'N',q:'Tras arreglar un error en el login, se verifica solo que ese arreglo puntual funcione. ¿Qué prueba es?',o:['Sanidad','Humo','Regresión','Sistema'],a:[0],e:'Sanidad: acotada a un área. Humo: amplia y superficial. Regresión: amplia y profunda.',f:'U6.2 · Humo, sanidad y regresión (diap. 21)'},
{id:'Y07',t:'tip',s:'N',q:'Se revisa que cada funcionalidad mencionada en los objetivos esté realmente implementada: «Exportar a PDF» no existe. ¿Qué prueba es?',o:['Alcance','Función','Volumen','Regresión'],a:[0],e:'Puede efectuarse sin computadora: es una revisión contra los objetivos.',f:'U6.2 · Pruebas de alcance (diap. 24)'},
{id:'Y08',t:'tip',s:'N',q:'Un auditor de pentesting recibe información parcial, como un usuario común. ¿Qué modalidad es?',o:['Caja gris','Caja negra','Caja blanca','Caja abierta'],a:[0],e:'Negra: sin información previa. Blanca: con acceso al código y a la arquitectura.',f:'U6.2 · Pentesting (diap. 30)'},
{id:'Y09',t:'tip',s:'N',m:1,q:'¿Qué se mide en una prueba de facilidad de uso?',o:['Tiempo de aprendizaje','Tasa de errores','Satisfacción del usuario','Retención de usuarios','Throughput por segundo'],a:[0,1,2,3],e:'El throughput se mira en las pruebas de performance.',f:'U6.2 · Facilidad de uso (diap. 28)'},
{id:'Y10',t:'tip',s:'N',q:'¿Qué afirmación sobre la prueba de sistema es correcta?',o:['Compara el sistema con sus objetivos originales; no es repetir las funcionales.','Prueba cada clase de forma aislada, con mocks para todas sus dependencias.','La realiza el usuario final para aceptar el sistema antes de ir a producción.','Se limita a los requisitos funcionales y deja de lado los no funcionales.'],a:[0],e:'Es la más difícil y la peor interpretada, y se hace en un entorno parecido a producción.',f:'U6.2 · Pruebas de sistema (diap. 22)'},
{id:'Y11',t:'tip',s:'N',q:'Se verifica que el sistema vuelva a operar tras una caída, con respaldos y en los tiempos acordados. ¿Qué prueba es?',o:['Recuperación','Instalación','Configuración','Regresión'],a:[0],e:'Es una de las «otras» pruebas de sistema.',f:'U6.2 · Otros tipos (diap. 31)'},
{id:'Y12',t:'tip',s:'N',q:'Las pruebas de función generalmente se realizan con técnicas de:',o:['Caja negra, porque se enfocan en entradas y salidas.','Caja blanca, porque se enfocan en entradas y salidas.','Caja negra, porque se enfocan en la estructura interna.','Caja blanca, porque se enfocan en la estructura interna.'],a:[0],e:'Verifican que el software cumpla con las funcionalidades especificadas en los requisitos.',f:'U6.2 · Pruebas de función (diap. 16)'},
{id:'Y13',t:'tip',s:'N',m:1,q:'¿Cuáles son objetivos de las pruebas de seguridad?',o:['Identificar vulnerabilidades.','Vulnerar los controles.','Verificar el cumplimiento de normativas.','Medir el tiempo de aprendizaje.'],a:[0,1,2],e:'El tiempo de aprendizaje se mide en las pruebas de facilidad de uso.',f:'U6.2 · Pruebas de seguridad (diap. 29)'},
{id:'Y14',t:'tip',s:'N',q:'Se prueba el módulo de reservas junto con el de pagos, que ya se habían probado por separado. ¿Qué prueba es?',o:['Integración','Sistema','Unidad','Aceptación'],a:[0],e:'Módulos ya probados de forma aislada se prueban juntos.',f:'U6.2 · Solución (diap. 39)'},

/* ---------- U6 · Aceptación y fin de las pruebas ---------- */
{id:'V01',t:'fin',s:'N',q:'Un grupo de recepcionistas valida en un entorno de prueba que el sistema sirve para su trabajo diario, antes de salir a producción. ¿Qué prueba es?',o:['Aceptación (UAT)','Sistema','Humo','Regresión'],a:[0],e:'La realiza el usuario final o el cliente, después de las de función, integración y sistema.',f:'U6.2 · UAT (diap. 32; solución diap. 39)'},
{id:'V02',t:'fin',s:'N',q:'¿Cuál es la diferencia entre las variantes alfa y beta de la prueba de aceptación?',o:['Alfa se hace dentro de la organización; beta, con usuarios reales.','Alfa se hace con usuarios reales; beta, dentro de la organización.','Alfa es de caja negra; beta es de caja blanca.','Alfa es contractual; beta no requiere ningún acuerdo.'],a:[0],e:'La otra variante mencionada es la aceptación contractual.',f:'U6.2 · UAT (diap. 32)'},
{id:'V03',t:'fin',s:'N',q:'Los criterios de aceptación se escriben:',o:['Antes de construir, con el cliente y en lenguaje del negocio.','Después de construir, por el equipo y en lenguaje técnico.','Durante las pruebas de unidad, por el programador del módulo.','Después del despliegue, a partir de los tickets de los usuarios.'],a:[0],e:'Formato: Dado (contexto), Cuando (acción), Entonces (resultado observable).',f:'U6.2 · Criterios de aceptación (diap. 33)'},
{id:'V04',t:'fin',s:'N',q:'«Cuando el conserje completa el alta con datos válidos». En el formato Dado, Cuando, Entonces, ¿qué representa esa parte?',o:['La acción del usuario','El contexto inicial','El resultado observable','La precondición técnica'],a:[0],e:'Dado: contexto inicial. Entonces: resultado observable.',f:'U6.2 · Criterios de aceptación (diap. 33)'},
{id:'V05',t:'fin',s:'N',m:1,q:'¿Qué se verifica en las pruebas de instalación?',o:['Rutas por defecto y personalizadas.','Permisos de usuario.','Dependencias, como librerías o drivers.','Rollback si la instalación falla.','Picos de carga de usuarios.'],a:[0,1,2,3],e:'Los picos de carga corresponden a las pruebas de esfuerzo.',f:'U6.2 · Pruebas de instalación (diap. 34)'},
{id:'V06',t:'fin',s:'N',m:1,q:'¿Cuáles de estos son criterios de poco sentido para terminar las pruebas?',o:['Terminar cuando se acaba el tiempo.','Terminar cuando se ejecutan todos los casos sin detectar errores.','Terminar cuando valores límite y conjetura no encuentran nada.','Terminar cuando los errores por unidad de tiempo bajan y se estabilizan.'],a:[0,1,2],e:'El último es un criterio positivo: la curva se aplana.',f:'U6.2 · ¿Cuándo terminar las pruebas? (diap. 35)'},
{id:'V07',t:'fin',s:'N',m:1,q:'¿Cuáles son criterios en términos positivos para terminar las pruebas?',o:['Estimar cuántos errores hay y terminar al encontrar cierta proporción.','Alcanzar la cobertura definida, con cero defectos críticos abiertos.','Comprobar que la curva de errores por unidad de tiempo se aplana.','Terminar en la fecha prevista, sin importar lo que se haya encontrado.'],a:[0,1,2],e:'Terminar cuando se acaba el tiempo es de los criterios de poco sentido.',f:'U6.2 · ¿Cuándo terminar las pruebas? (diap. 35)'},
{id:'V08',t:'fin',s:'N',q:'En la curva de errores encontrados, ¿cuándo aparece el candidato a terminar?',o:['Cuando baja y se aplana: cada vez cuesta más encontrar errores.','Cuando sube: se están preparando y ejecutando las pruebas.','Cuando alcanza su pico: ya se encontró la mayoría de los errores.','Cuando vale cero en el primer día: el sistema no tiene errores.'],a:[0],e:'Es el análisis de la curva que muestra el apunte.',f:'U6.2 · La curva de errores (diap. 36)'},
{id:'V09',t:'fin',s:'N',m:1,q:'¿Qué debe definir el planeamiento y control de la prueba?',o:['Objetivos','Criterios de terminación','Cronograma','Responsabilidades','Corrección de defectos'],a:[0,1,2,3],e:'El quinto elemento es la asignación de recursos. Corregir es parte de la depuración.',f:'U6.2 · Planeamiento y control (diap. 37)'},

/* ---------- U6 · Conversión de programas ---------- */
{id:'H01',t:'conv',s:'N',q:'Una cadena de 120 farmacias implanta un sistema de stock nuevo, con sucursales chicas y grandes en todo el país. ¿Qué estrategia conviene?',o:['Distribuida','Paralela','Total','Por prototipado'],a:[0],e:'Se empieza por las sucursales chicas y se escala a las grandes con la experiencia acumulada.',f:'U6.3 · Solución (diap. 29)'},
{id:'H02',t:'conv',s:'N',q:'Un organismo deja de aceptar el formato de facturación anterior el 1 de enero. ¿Qué estrategia conviene?',o:['Total','Gradual','Paralela','Por prototipado'],a:[0],e:'Hay una fecha impuesta: se ensaya el corte y se prepara un plan de contingencia.',f:'U6.3 · Solución (diap. 29)'},
{id:'H03',t:'conv',s:'N',q:'Un municipio quiere un portal de trámites, pero sus empleados no saben bien qué necesitan del sistema. ¿Qué estrategia conviene?',o:['Por prototipado','Distribuida','Total','Paralela'],a:[0],e:'Los requerimientos son difusos: se muestran versiones tempranas y se ajusta con los usuarios.',f:'U6.3 · Solución (diap. 29)'},
{id:'H04',t:'conv',s:'N',q:'Un ERP reemplaza a un sistema viejo; compras, stock y ventas se pueden separar. ¿Qué estrategia conviene?',o:['Gradual','Total','Paralela','Distribuida'],a:[0],e:'El riesgo se reparte módulo a módulo, aunque se necesite código de sincronización temporal.',f:'U6.3 · Solución (diap. 29)'},
{id:'H05',t:'conv',s:'N',q:'Según la comparación de estrategias, ¿cuál combina riesgo alto, costo bajo y vuelta atrás difícil?',o:['Total','Paralela','Gradual','Distribuida'],a:[0],e:'Paralela es lo opuesto: riesgo bajo, costo alto y vuelta atrás inmediata.',f:'U6.3 · Comparación de estrategias (diap. 9)'},
{id:'H06',t:'conv',s:'N',m:1,q:'¿Cuáles son riesgos o costos de la conversión en paralelo?',o:['Doble operación y doble carga de datos.','Requiere gran manejo del personal.','Los usuarios se cansan de cargar todo dos veces.','Todo el riesgo se concentra en un solo día.'],a:[0,1,2],e:'Concentrar el riesgo en un día corresponde a la conversión total.',f:'U6.3 · Conversión en paralelo (diap. 5)'},
{id:'H07',t:'conv',s:'N',m:1,q:'¿Cuáles son riesgos o costos de la conversión gradual?',o:['Problemas de acople entre módulos viejos y nuevos.','Funciones de sincronización que luego se desechan.','Doble carga completa de todos los datos del sistema.','Implantación sede por sede en todas las sucursales.'],a:[0,1],e:'La doble carga es de la paralela, y la implantación por sede es de la distribuida.',f:'U6.3 · Conversión gradual (diap. 6)'},
{id:'H08',t:'conv',s:'N',q:'¿Cuándo conviene la conversión total?',o:['En sistemas triviales, si el anterior colapsó o si lo impone la ley.','En sistemas críticos donde cualquier error resulta inaceptable.','En instituciones con muchas sucursales de distintos tamaños.','Cuando los requerimientos son poco claros o van cambiando.'],a:[0],e:'Las otras opciones corresponden a paralela, distribuida y prototipado.',f:'U6.3 · Conversión total (diap. 4)'},
{id:'H09',t:'conv',s:'N',q:'¿Se pueden combinar las estrategias de conversión?',o:['Sí, por ejemplo, distribuida con paralela en cada sede.','No, porque cada proyecto admite una única estrategia.','Sí, pero solo total con paralela, en la misma fecha.','No, salvo que el sistema anterior ya haya colapsado.'],a:[0],e:'Es un continuo: las estrategias se pueden combinar.',f:'U6.3 · Cinco formas de reemplazar un sistema (diap. 3)'},
{id:'H10',t:'conv',s:'N',m:1,q:'¿Cuáles de estas son etapas de la implementación?',o:['Conversión de programas','Conversión de datos','Conversión de procedimientos','Capacitación a usuarios','Prueba de unidad'],a:[0,1,2,3],e:'La quinta etapa es la evaluación final. El sistema ya llega probado.',f:'U6.3 · Las cinco etapas (diap. 2)'},

/* ---------- U6 · Datos, procedimientos y capacitación ---------- */
{id:'G01',t:'impl',s:'N',q:'¿Cuál es el orden del proceso de conversión de datos?',o:['Extraer, transformar, cargar y validar.','Cargar, transformar, extraer y validar.','Transformar, extraer, validar y cargar.','Validar, extraer, cargar y transformar.'],a:[0],e:'La validación incluye reconciliar y aprobar.',f:'U6.3 · Conversión de datos (diap. 12)'},
{id:'G02',t:'impl',s:'N',q:'Tras migrar, se comparan la cantidad de registros y los totales de control entre origen y destino. ¿Qué paso es?',o:['Reconciliar','Inventariar fuentes','Mapear campos','Ensayar la migración'],a:[0],e:'Se debe cumplir que origen = destino.',f:'U6.3 · Migrar sin perder información (diap. 13)'},
{id:'G03',t:'impl',s:'N',q:'¿Qué afirma el apunte sobre el costo de la conversión de datos?',o:['Puede igualar al de desarrollar el nuevo sistema: se planifica y presupuesta desde el inicio.','Es siempre insignificante frente al desarrollo: se resuelve durante la semana del corte.','Lo asume siempre el cliente: por eso queda fuera del plan y del presupuesto del proyecto.','Desaparece si se usa una conversión paralela: los dos sistemas comparten todos los datos.'],a:[0],e:'No es una tarea menor: es parte del proyecto.',f:'U6.3 · Conversión de datos (diap. 12)'},
{id:'G04',t:'impl',s:'N',m:1,q:'¿Cuáles son pasos recomendados para migrar sin perder información?',o:['Limpiar y depurar duplicados y nulos.','Ensayar con corridas de prueba.','Definir un plan de corte y vuelta atrás.','Apagar el origen antes de extraer los datos.'],a:[0,1,2],e:'Sin el origen no se podría extraer ni reconciliar.',f:'U6.3 · Migrar sin perder información (diap. 13)'},
{id:'G05',t:'impl',s:'N',q:'Un pedido en papel con firma pasa a ser un pedido online con aprobación digital. ¿Qué etapa de la implementación es?',o:['Conversión de procedimientos','Conversión de programas','Conversión de datos','Evaluación final'],a:[0],e:'Los procedimientos cambian o se rediseñan (reingeniería), y eso puede resultar traumático.',f:'U6.3 · Conversión de procedimientos (diap. 14)'},
{id:'G06',t:'impl',s:'N',m:1,q:'¿Qué acciones forman parte de la gestión del cambio en la conversión de procedimientos?',o:['Explicar el porqué del cambio.','Involucrar a usuarios clave.','Acompañar y medir la adopción.','Mantener en secreto el rediseño.'],a:[0,1,2],e:'Los empleados deben apegarse a los nuevos procedimientos; sin eso, el sistema no rinde.',f:'U6.3 · Conversión de procedimientos (diap. 14)'},
{id:'G07',t:'impl',s:'N',q:'Una capacitación explica qué problemas resuelve el sistema, qué beneficios aporta y qué indicadores ofrece, a quienes deciden. ¿Qué tipo es?',o:['Ejecutiva','Operativa','Técnica','De soporte'],a:[0],e:'Es «vender el producto». La operativa enseña el qué y el cómo a quienes lo usan a diario.',f:'U6.3 · Capacitación a usuarios (diap. 15)'},
{id:'G08',t:'impl',s:'N',q:'¿Para qué sirve un sandbox en la capacitación?',o:['Para practicar con datos de ejemplo y equivocarse sin riesgo.','Para migrar los datos de producción antes del corte definitivo.','Para comparar en paralelo los resultados de ambos sistemas.','Para que el equipo de desarrollo corra las pruebas de unidad.'],a:[0],e:'Es el entorno de práctica de la capacitación.',f:'U6.3 · Cómo y cuándo capacitar (diap. 16)'},
{id:'G09',t:'impl',s:'N',q:'¿Cuál es el orden adecuado de las acciones de capacitación respecto del corte?',o:['Antes: capacitación formal. Durante: soporte en sitio. Después: refuerzo y consultas.','Antes: refuerzo y consultas. Durante: capacitación formal. Después: soporte en sitio.','Antes: soporte en sitio. Durante: refuerzo y consultas. Después: capacitación formal.','Antes: nada. Durante: capacitación formal. Después: nada, porque ya se migró todo.'],a:[0],e:'Es la línea de tiempo que muestra el apunte.',f:'U6.3 · Cómo y cuándo capacitar (diap. 16)'},
{id:'G10',t:'impl',s:'N',q:'¿Qué pregunta responde la evaluación final de la implementación?',o:['¿El sistema hace lo que se prometió, al costo y en el plazo previstos?','¿Qué estrategia de conversión conviene según los riesgos del proyecto?','¿Qué módulos faltan probar antes de capacitar a los primeros usuarios?','¿Qué estilo arquitectónico conviene adoptar para la próxima versión?'],a:[0],e:'Revisa requisitos, objetivos de negocio, datos, usuarios, costo y plazo, y lecciones aprendidas.',f:'U6.3 · Evaluación final (diap. 17)'},

/* ---------- U6 · Gestión de liberaciones ---------- */
{id:'Z01',t:'rel',s:'N',q:'¿Cuál es el orden del ciclo de liberación?',o:['Iniciación, planificación, desarrollo, testing, despliegue y post-deploy.','Planificación, iniciación, testing, desarrollo, post-deploy y despliegue.','Iniciación, desarrollo, planificación, despliegue, testing y post-deploy.','Desarrollo, testing, iniciación, planificación, post-deploy y despliegue.'],a:[0],e:'Es un ciclo continuo: lo aprendido vuelve a la iniciación.',f:'U6.3 · Gestión de liberaciones (diap. 18)'},
{id:'Z02',t:'rel',s:'N',q:'Una versión pasa de v2.2.1 a v2.2.2 porque se corrigió un cálculo, sin cambiar la funcionalidad. ¿Qué tipo de release es?',o:['Patch','Minor','Major','Beta'],a:[0],e:'Patch: corrección de errores sin cambiar la funcionalidad.',f:'U6.3 · Major, minor, patch (diap. 24)'},
{id:'Z03',t:'rel',s:'N',q:'Se agrega una nueva opción de pago que mantiene la compatibilidad con la versión anterior. ¿Qué tipo de release es?',o:['Minor','Patch','Major','Release Candidate'],a:[0],e:'Minor: funcionalidades nuevas que mantienen la compatibilidad.',f:'U6.3 · Major, minor, patch (diap. 24)'},
{id:'Z04',t:'rel',s:'N',q:'Se rediseña la API y la nueva versión es incompatible con la anterior. ¿Qué tipo de release es?',o:['Major','Minor','Patch','General Availability'],a:[0],e:'Major: cambios grandes, con posibles incompatibilidades, como migraciones o rediseños.',f:'U6.3 · Major, minor, patch (diap. 24)'},
{id:'Z05',t:'rel',s:'N',q:'¿Cuál es el orden de madurez de una versión?',o:['Alpha, Beta, Release Candidate y General Availability.','Beta, Alpha, General Availability y Release Candidate.','Alpha, Release Candidate, Beta y General Availability.','Release Candidate, Alpha, Beta y General Availability.'],a:[0],e:'Ejemplo: 3.0.0-alpha.1, 3.0.0-beta.2, 3.0.0-rc.1, 3.0.0.',f:'U6.3 · De alpha a GA (diap. 25)'},
{id:'Z06',t:'rel',s:'N',q:'Una versión es candidata a ser la final y solo se le corrigen bugs críticos. ¿En qué etapa está?',o:['Release Candidate','Beta','Alpha','General Availability'],a:[0],e:'Beta tiene funcionalidad completa con errores conocidos, y se entrega a usuarios seleccionados.',f:'U6.3 · De alpha a GA (diap. 25)'},
{id:'Z07',t:'rel',s:'N',q:'Hay dos entornos idénticos y se cambia el tráfico de uno a otro, con vuelta atrás inmediata, a costa de duplicar infraestructura. ¿Qué estrategia es?',o:['Blue-green','Rolling','Canary','Feature flags'],a:[0],e:'Se cambia el tráfico del azul al verde.',f:'U6.3 · Estrategias de despliegue (diap. 22)'},
{id:'Z08',t:'rel',s:'N',q:'La nueva versión llega primero a un pequeño porcentaje de usuarios, para detectar problemas con poco impacto. ¿Qué estrategia es?',o:['Canary','Blue-green','Rolling','Feature flags'],a:[0],e:'Limita el impacto de un posible problema.',f:'U6.3 · Estrategias de despliegue (diap. 22)'},
{id:'Z09',t:'rel',s:'N',q:'Se actualiza de a pocos servidores por vez, sin cortes, aunque durante un tiempo conviven dos versiones. ¿Qué estrategia es?',o:['Rolling','Canary','Blue-green','Feature flags'],a:[0],e:'No hay cortes, pero hay convivencia de versiones.',f:'U6.3 · Estrategias de despliegue (diap. 22)'},
{id:'Z10',t:'rel',s:'N',q:'El código se despliega apagado y se enciende por funcionalidad. ¿Qué logra esa estrategia?',o:['Separar desplegar de liberar.','Duplicar los entornos de producción.','Eliminar la necesidad de un rollback.','Actualizar de a un servidor por vez.'],a:[0],e:'Son los feature flags. Toda estrategia necesita un rollback definido y probado antes del despliegue.',f:'U6.3 · Estrategias de despliegue (diap. 22)'},
{id:'Z11',t:'rel',s:'N',q:'En la iniciación del release llegan nuevas características, bugs y cambios solicitados. ¿Qué se hace con ellos?',o:['Se evalúan por impacto, prioridad, factibilidad y costo, y se aprueban, postergan o rechazan.','Se implementan todos en el orden de llegada, hasta completar el tiempo del release.','Se envían directamente a producción como hotfix para no demorar a los usuarios.','Se documentan en la nota de release y se dejan como problemas conocidos.'],a:[0],e:'Las solicitudes aprobadas pasan a la planificación del release.',f:'U6.3 · Iniciación (diap. 19)'},
{id:'Z12',t:'rel',s:'N',m:1,q:'¿Qué partes incluye una nota de release?',o:['Resumen ejecutivo','Detalle de cambios','Impacto para el usuario','Problemas conocidos','Código fuente de los cambios'],a:[0,1,2,3],e:'Además: información general, instrucciones y contacto. Debe escribirse para la audiencia, en lenguaje claro.',f:'U6.3 · Nota de release (diap. 26)'},
{id:'Z13',t:'rel',s:'N',q:'Tras el despliegue aparece una falla crítica en producción. ¿Qué actividad de post deployment corresponde?',o:['Aplicar un hotfix','Iniciar otro major','Repetir el UAT completo','Capacitar a los ejecutivos'],a:[0],e:'Monitorear incluye resolver errores urgentes, con soporte reforzado en los primeros días.',f:'U6.3 · Post deployment (diap. 23)'},
{id:'Z14',t:'rel',s:'N',q:'Según el apunte, ¿cuándo está terminada una versión?',o:['Cuando los usuarios pueden usarla.','Cuando el código funciona.','Cuando se aprueba el plan.','Cuando pasa la prueba de unidad.'],a:[0],e:'Por eso el deployment incluye capacitar a los usuarios y comunicar la nota de release.',f:'U6.3 · Diseñar, probar, desplegar (diap. 21)'}
];

/* ---------- Ejercicios de desarrollo con diagramas ---------- */
const DEV=[{id:'DIA01',t:'dao',s:'N',k:'dev',diagram:'dao',q:'Una tienda necesita consultar y guardar productos tanto en una base SQL como en una implementación en memoria para pruebas.',p:[
'Responsabilidad de GestorProducto, IProductoDAO, ProductoDAOSQL, ProductoDAOMemoria y DAOFactory. Justificá por qué el gestor depende de la interfaz.',
'Explicá las relaciones de implementación, dependencia y creación. ¿Qué ocurre si GestorProducto construye directamente ProductoDAOSQL?',
'Indicá qué principios SOLID favorece el diseño y cómo incorporarías ProductoDAOMongo sin modificar la lógica de negocio.',
'Implementá las operaciones principales respetando las relaciones del diagrama, usando el formato de pseudocódigo de la cátedra.'
],m:[
'GestorProducto coordina el caso de uso y conoce el contrato IProductoDAO. La interfaz declara buscarPorId y guardar. ProductoDAOSQL persiste en SQL y ProductoDAOMemoria usa memoria, ambas con el mismo contrato. DAOFactory centraliza la creación según TipoDAO. Producto es la entidad de dominio, usada por IProductoDAO.',
'Las clases concretas realizan IProductoDAO; GestorProducto depende de la interfaz y la Factory depende de las implementaciones porque las crea. Si el gestor construyera ProductoDAOSQL quedaría acoplado a SQL, sería más difícil probarlo y cambiar de motor, y se violaría DIP.',
'Se favorecen DIP, SRP y OCP. Se crea ProductoDAOMongo implementando IProductoDAO y se agrega su caso de creación en DAOFactory; GestorProducto permanece igual.',
'Interfaz IProductoDAO\n    Métodos:\n        buscarPorId(id)\n            devolver el producto cuyo identificador sea id\n        FinMetodo\n        guardar(producto)\n            persistir producto\n        FinMetodo\nFinClase\n\nClase GestorProducto\n    Atributos:\n        dao: IProductoDAO\n    Métodos:\n        obtenerProducto(id)\n            producto <- dao.buscarPorId(id)\n            devolver producto\n        FinMetodo\nFinClase\n\nClase ProductoDAOSQL implementa IProductoDAO\n    Métodos:\n        buscarPorId(id)\n            consultar la base SQL\n            devolver la entidad Producto\n        FinMetodo\n        guardar(producto)\n            guardar los datos en SQL\n        FinMetodo\nFinClase'
]},
{id:'DIA02',t:'gof',s:'N',k:'dev',diagram:'factory',q:'Una plataforma exporta documentos PDF y HTML y debe incorporar formatos sin que el cliente conozca clases concretas.',p:[
'Describí la responsabilidad de GeneradorDocumento, sus generadores concretos, Documento y los documentos concretos. ¿Qué operación queda diferida?',
'Justificá herencia, implementación y dependencia. ¿Qué ventaja ofrece que exportar use crearDocumento?',
'Para agregar DocumentoCSV, indicá qué clases crearías o modificarías y relacioná la solución con OCP. Señalá una desventaja.',
'Implementá exportar y la creación de un documento concreto en pseudocódigo con el formato de la cátedra.'
],m:[
'GeneradorDocumento define el algoritmo exportar y declara crearDocumento como Factory Method. GeneradorPDF y GeneradorHTML concretan la creación. Documento es el producto abstracto y DocumentoPDF y DocumentoHTML implementan generar.',
'La herencia especializa el generador; la realización indica que cada documento cumple Documento; las dependencias muestran qué producto construye cada generador. GeneradorDocumento usa Documento y exportar pide crearDocumento y luego generar, por lo que el algoritmo es común y la decisión queda polimórfica.',
'Se agregan DocumentoCSV implementando Documento y GeneradorCSV heredando de GeneradorDocumento. No se toca el cliente ni el algoritmo existente, favoreciendo OCP. La desventaja es aumentar clases e indirección.',
'Interfaz Documento\n    Métodos:\n        generar()\n            producir el contenido del documento\n        FinMetodo\nFinClase\n\nClase abstracta GeneradorDocumento\n    Métodos:\n        crearDocumento()\n            devolver un Documento concreto\n        FinMetodo\n        exportar()\n            documento <- crearDocumento()\n            documento.generar()\n        FinMetodo\nFinClase\n\nClase GeneradorPDF hereda de GeneradorDocumento\n    Métodos:\n        crearDocumento()\n            devolver un DocumentoPDF\n        FinMetodo\nFinClase'
]},
{id:'DIA03',t:'gof',s:'N',k:'dev',diagram:'observer',q:'Una tienda avisa por correo y SMS cada vez que cambia el estado de un pedido, sin que el pedido conozca los detalles de cada canal.',p:[
'Explicá las responsabilidades de PedidoObservable, Observador, NotificadorEmail y NotificadorSMS. ¿Por qué la relación es una agregación 0..*?',
'Describí el flujo de suscribir, cambiarEstado, notificar y desuscribir. ¿Qué problema habría con llamadas directas a cada canal?',
'Justificá la implementación de Observador y relacioná el diseño con bajo acoplamiento, SRP y OCP. ¿Cómo agregarías una notificación móvil?',
'Implementá el cambio de estado, la notificación a todos los observadores y un observador concreto en pseudocódigo.'
],m:[
'PedidoObservable mantiene el estado y la lista, y notifica. Observador define actualizar. NotificadorEmail y NotificadorSMS concretan cada canal. La agregación 0..* indica que puede haber ninguno, uno o muchos observadores independientes del pedido.',
'El cliente suscribe; cambiarEstado actualiza el estado y llama a notificar (operación privada); notificar recorre la lista y llama actualizar; desuscribir quita uno. Las llamadas directas acoplarían el pedido a clases concretas y mezclarían estado con comunicación.',
'La realización permite sustituir observadores. Se favorecen bajo acoplamiento, SRP y OCP: un canal nuevo es una clase nueva. Para móvil se crea NotificadorPush implementando Observador y se suscribe sin cambiar PedidoObservable.',

  q.p.forEach((prompt,j)=>{
    const value=Array.isArray(S.ans[i])?S.ans[i][j]||'':'';
    h+=`<div class="dev-question"><label for="dev-${i}-${j}">${j+1}. ${esc(prompt)}</label><textarea id="dev-${i}-${j}" data-dev="${j}" rows="${j===q.p.length-1?16:6}" ${reveal?'readonly':''}>${esc(value)}</textarea>`;
    if(reveal)h+=`<div class="hint model-answer"><b>Respuesta modelo</b><pre>${esc(q.m[j])}</pre></div>`;
    h+='</div>';
  });
  return h;
}
function render(focusOpt){
  const i=S.i,q=qOf(i),n=S.ids.length,prac=S.mode==='practice',rev=prac&&S.checked[i];
  const count=prac?S.checked.filter(Boolean).length:S.ids.filter((_,k)=>answered(k)).length;
  /* Con muchas preguntas, la grilla se pliega para no tapar el enunciado. */
  const fold=n>30;
  let h=`<div class="progress"><div style="width:${count/n*100}%"></div></div>`+(fold?`<details class="navwrap"><summary>Pregunta ${i+1} de ${n} · ir a otra</summary>`:'')+`<div class="nav">`;
  h+=S.ids.map((id,k)=>{let c=k===i?'cur ':'';if(prac&&S.checked[k])c+=scoreQ(byId[id],S.ans[k])>=1?'okq':'badq';else if(answered(k))c+='done';return `<button class="${c}" data-go="${k}" aria-label="Ir a la pregunta ${k+1}">${k+1}</button>`}).join('');
  h+=`</div>${fold?'</details>':''}<div class="card"><span class="tag">${esc(TOPIC[q.t])}</span>${q.s==='P'?'<span class="tag src">Parcial modelo</span>':''}`;
  h+=stemHTML(q,'h2');
  if(q.k==='dev'){
    h+=`<p class="muted">Complete todos los incisos. Se considera respondido cuando hay contenido escrito; la corrección es para autoevaluación.</p>`;
    h+=devHTML(q,i,rev);
  }else{
    h+=q.m?'<p class="muted">Seleccione todas las opciones correctas.</p>':'<p class="muted">Seleccione una opción.</p>';
    h+=`<div role="${q.m?'group':'radiogroup'}">`+S.ord[i].map((j,pos)=>optHTML(q,i,j,pos,rev)).join('')+'</div>';
  }
  if(rev){const sc=scoreQ(q,S.ans[i]);h+=`<p class="verdict" style="color:${sc>=1?'#34D399':sc>0?'var(--warn)':'var(--bad)'}">${sc>=1?'Correcta':sc>0?`Parcialmente correcta (${Math.round(sc*100)} %)`:'Incorrecta'}</p>`+(q.k==='dev'?'':hintHTML(q))}
  h+=`</div><div class="row"><button class="b s" data-act="prev" ${i?'':'disabled'}>Anterior</button><span class="muted">${count}/${n} ${prac?'verificadas':'respondidas'}</span>`;
  if(prac&&!rev)h+=`<button class="b" data-act="verify" ${answered(i)?'':'disabled'}>Verificar</button>`;
  else if(prac){const k=nextUnchecked();h+=k>=0?`<button class="b" data-act="nextun">Siguiente</button>`:`<button class="b" data-act="finish">Ver resultados</button>`}
  else h+=i<n-1?`<button class="b" data-act="next">Siguiente</button>`:`<button class="b" data-act="finish">Finalizar</button>`;
  h+='</div>';
  if(S.mode==='exam'&&i<n-1)h+=`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="link" data-act="finish">Finalizar ahora</button></div>`;
  if(prac&&!rev&&count>0)h+=`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="link" data-act="finish">Terminar y ver resultados</button></div>`;
  h+=`<p class="kbd"><kbd>a</kbd>–<kbd>f</kbd> marcar · <kbd>←</kbd> <kbd>→</kbd> moverse · <kbd>Enter</kbd> ${prac?'verificar / siguiente':'siguiente'}</p>`;
  $('#app').innerHTML=h;
  if(focusOpt!==undefined){const e=document.querySelector(`[data-opt="${focusOpt}"]`);if(e)e.focus({preventScroll:true})}
}
function results(){
  const rows=S.ids.map((id,i)=>{const q=byId[id];return{q,i,sc:scoreQ(q,S.ans[i]),blank:!answered(i)}});
  const total=rows.reduce((s,r)=>s+r.sc,0),nota=Math.round(total/rows.length*100),pass=nota>=PASS;
  const full=rows.filter(r=>r.sc>=1).length,blank=rows.filter(r=>r.blank).length,part=rows.filter(r=>r.sc>0&&r.sc<1).length,bad=rows.length-full-blank-part;
  const byT={};rows.forEach(r=>{(byT[r.q.t]=byT[r.q.t]||{sum:0,n:0}).sum+=r.sc;byT[r.q.t].n++});
  const bars=Object.entries(byT).map(([t,v])=>({t,p:v.sum/v.n,n:v.n})).sort((a,b)=>a.p-b.p);
  const failed=rows.filter(r=>r.sc<1);
  let h=`<div class="card" style="text-align:center;border-color:${pass?'var(--ok)':'var(--bad)'}">`;
  if(S.auto)h+='<p class="warn">Se agotó el tiempo: el intento se corrigió automáticamente.</p>';
  h+=`<div class="muted">Nota</div><div class="big" style="color:${pass?'var(--ok)':'var(--bad)'}">${nota}<small style="font-size:22px">/100</small></div><div style="font-weight:700;font-size:17px;color:${pass?'var(--ok)':'var(--bad)'}">${pass?'Aprobado':'A reforzar'}</div>`;
  h+=`<div class="stats"><span>Correctas: <b>${full}</b></span><span>Parciales: <b>${part}</b></span><span>Incorrectas: <b>${bad}</b></span><span>Sin responder: <b>${blank}</b></span></div>`;
  h+=`<div class="row" style="justify-content:center">${failed.length?'<button class="b" data-act="retry">Repetir las que fallé</button>':''}<button class="b s" data-act="home">Volver al inicio</button></div></div>`;
  h+=`<div class="card"><h3>Por tema</h3>`+bars.map(b=>`<div class="bar"><span>${esc(TOPIC[b.t])}</span><i><u style="width:${b.p*100}%;background:${b.p>=.6?'var(--ok)':b.p>=.3?'var(--warn)':'var(--bad)'}"></u></i><em>${Math.round(b.p*100)} % · ${b.n}</em></div>`).join('')+'</div>';
  h+=`<div class="row" style="margin-bottom:10px"><h3 style="margin:0">Revisión</h3><div class="seg"><button data-filter="bad" aria-pressed="${S.filter==='bad'}">Para revisar (${failed.length})</button><button data-filter="all" aria-pressed="${S.filter==='all'}">Todas (${rows.length})</button></div></div>`;
  const show=S.filter==='bad'?failed:rows;
  if(!show.length)h+='<div class="card muted">No hay preguntas para revisar.</div>';
  h+=show.map(r=>`<div class="card"><div class="row"><span><span class="tag">${esc(TOPIC[r.q.t])}</span><span class="tag src">${SRC[r.q.s]}</span></span><b style="color:${r.sc>=1?'var(--ok)':r.sc>0?'var(--warn)':'var(--bad)'}">${r.blank?'Sin responder':Math.round(r.sc*100)+' %'}</b></div>${stemHTML({...r.q,q:(r.i+1)+'. '+r.q.q},'h2')}${r.q.k==='dev'?devHTML(r.q,r.i,true):S.ord[r.i].map((j,pos)=>optHTML(r.q,r.i,j,pos,true)).join('')}${r.q.k==='dev'?'':hintHTML(r.q)}</div>`).join('');
  $('#app').innerHTML=h;
}
function home(){
  const wrong=Object.keys(store.wrong).filter(id=>byId[id]),pool=poolFor(cfg),resume=load(SESSION,null);
  const seen=BANK.filter(q=>store.seen[q.id]).length,orig=BANK.filter(q=>q.s==='P').length;
  const count=cfg.n>=9999?pool.length:Math.min(cfg.n,pool.length);
  let h=`<div class="card"><h1>Practicá para el Parcial 2</h1><p class="muted">${BANK.length} preguntas: ${orig} del parcial modelo, más adaptadas y nuevas. Ya viste ${seen}.</p>`;
  if(resume&&resume.ids&&resume.ids.every(id=>byId[id]))h+=`<div class="row" style="margin-top:10px"><span class="warn">Tenés un intento sin terminar (${resume.mode==='exam'?'simulacro':'práctica'}, ${resume.ids.length} preguntas).</span><span class="row"><button class="b small" data-act="resume">Continuar</button><button class="b s small" data-act="discard">Descartar</button></span></div>`;
  h+=`</div><div class="card"><div class="field"><span class="lab">Modo</span><div class="seg"><button data-mode="exam" aria-pressed="${cfg.mode==='exam'}">Simulacro</button><button data-mode="practice" aria-pressed="${cfg.mode==='practice'}">Práctica</button></div><p class="muted" style="margin-top:6px">${cfg.mode==='exam'?'Con tiempo y corrección al final.':'Sin tiempo: corrige y explica cada pregunta al responderla.'}</p></div>`;
  h+=`<div class="field"><span class="lab">Cantidad de preguntas</span><div class="seg">${[[10,'10'],[18,'18'],[30,'30'],[50,'50'],[9999,'Todas']].map(([v,l])=>`<button data-n="${v}" aria-pressed="${cfg.n===v}">${l}</button>`).join('')}</div></div>`;
  if(cfg.mode==='exam')h+=`<div class="field"><label class="check"><input type="checkbox" id="timed" ${cfg.timed?'checked':''}> Con límite de tiempo (${EXAM_MINUTES} minutos)</label></div>`;
  h+=`<div class="field"><label class="check"><input type="checkbox" id="orig" ${cfg.origOnly?'checked':''}> Solo preguntas del parcial modelo</label></div></div>`;
  h+=`<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">Temas</h3><span class="row"><button class="link" data-all="1">Todos</button><button class="link" data-all="0">Ninguno</button></span></div>`;
  UNITS.forEach((u,ui)=>{
    h+=`<div class="unit"><div class="row"><b>${esc(u.u)}</b><button class="link" data-unit="${ui}">Alternar unidad</button></div><div class="chips">`+u.t.map(([k,l])=>{const c=BANK.filter(q=>q.t===k&&(!cfg.origOnly||q.s==='P')).length;return `<button class="chip" data-topic="${k}" aria-pressed="${cfg.topics.includes(k)}">${esc(l)}<span>${c}</span></button>`}).join('')+'</div></div>';
  });
  h+=`</div><div class="row" style="margin-bottom:14px"><button class="b" data-act="start" ${pool.length?'':'disabled'}>Empezar (${count})</button><button class="b s" data-act="review" ${wrong.length?'':'disabled'}>Repasar falladas (${wrong.length})</button></div>`;
  if(!pool.length)h+='<p class="warn">No hay preguntas con esa selección de temas.</p>';
  h+=`<div class="card"><details><summary>Qué quedó afuera del banco</summary><p style="margin-top:8px">Estos temas no tienen preguntas, porque no figuran en el programa (Contenido Parcial 2.png) o solo se nombran en las presentaciones:</p><ul><li>Administración de la Configuración: líneas base e ítems de configuración.</li><li>Tipos de mantenimiento y rejuvenecimiento del software.</li><li>Diagrama de actividad: nodo final de flujo y de actividad.</li><li>Los demás patrones del catálogo, que solo aparecen nombrados.</li></ul><p style="margin-top:8px">Strategy, Observer, Factory Method, Abstract Factory y Adapter también aparecen solo nombrados, pero se incluyeron como un tema aparte. Sus respuestas salen del libro <i>Patrones de Diseño</i>, no de los apuntes.</p></details>${seen?'<p style="margin:10px 0 0"><button class="link" data-act="wipe">Borrar mi progreso</button></p>':''}</div>`;
  $('#app').innerHTML=h;
}
/* ---------- Eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b){return}
  const d=b.dataset;
  if(d.opt!==undefined)return choose(+d.opt);
  if(d.go!==undefined)return go(+d.go);
  if(d.mode){cfg.mode=d.mode;return home()}
  if(d.n){cfg.n=+d.n;return home()}
  if(d.topic){cfg.topics=cfg.topics.includes(d.topic)?cfg.topics.filter(t=>t!==d.topic):[...cfg.topics,d.topic];return home()}
  if(d.all!==undefined){cfg.topics=d.all==='1'?Object.keys(TOPIC):[];return home()}
  if(d.unit!==undefined){const ks=UNITS[+d.unit].t.map(x=>x[0]),on=ks.every(k=>cfg.topics.includes(k));cfg.topics=on?cfg.topics.filter(t=>!ks.includes(t)):[...new Set([...cfg.topics,...ks])];return home()}
  if(d.filter){S.filter=d.filter;return results()}
  switch(d.act){
    case'start':return begin(pick({...cfg,n:cfg.n>=9999?poolFor(cfg).length:cfg.n}),cfg.mode,cfg.mode==='exam'&&cfg.timed);
    case'review':return begin(shuffle(Object.keys(store.wrong).filter(id=>byId[id]).map(id=>byId[id])),'practice',false);
    case'resume':S=load(SESSION,null);runTimer();if(!S.done)render();return;
    case'discard':S=null;persist();return home();
    case'wipe':if(confirm('¿Borrar las preguntas vistas y falladas?')){store={seen:{},wrong:{}};save(KEY,store);home()}return;
    case'prev':return go(S.i-1);
    case'next':return go(S.i+1);
    case'verify':return verify();
    case'nextun':return go(nextUnchecked());
    case'finish':return finish();
    case'retry':{const ids=S.ids.filter((id,i)=>scoreQ(byId[id],S.ans[i])<1).map(id=>byId[id]);S=null;persist();return begin(shuffle(ids),'practice',false)}
    case'home':S=null;persist();runTimer();return home();
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset.dev!==undefined)return saveDevAnswer(ev.target,S.i);
  if(ev.target.id==='timed'){cfg.timed=ev.target.checked;home()}
  if(ev.target.id==='orig'){cfg.origOnly=ev.target.checked;home()}
});
document.addEventListener('input',ev=>{
  if(ev.target.dataset.dev!==undefined)saveDevAnswer(ev.target,S.i);
});
$('#exit').addEventListener('click',()=>{
  if(!S||S.done)return;
  if(confirm('¿Salir al inicio? El intento queda guardado y podés continuarlo después.')){persist();clearInterval(tmr);S=null;runTimer();home()}
});
document.addEventListener('keydown',ev=>{
  if(!S||S.done||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const tgt=ev.target.tagName;
  if(ev.key==='ArrowLeft')return go(S.i-1);
  if(ev.key==='ArrowRight')return go(S.i+1);
  if(ev.key==='Enter'){
    /* Enter sobre una opción ya marcada avanza; sobre otros botones, los activa. */
    if(tgt==='BUTTON'&&!(ev.target.dataset.opt!==undefined&&answered(S.i)))return;
    ev.preventDefault();
    if(S.mode==='practice'){if(S.checked[S.i]){const k=nextUnchecked();k>=0?go(k):finish()}else verify()}
    else if(S.i<S.ids.length-1)go(S.i+1);
    return;
  }
  const pos=ev.key.toLowerCase().charCodeAt(0)-97;
  if(ev.key.length===1&&pos>=0&&pos<S.ord[S.i].length)choose(S.ord[S.i][pos]);
});
tick();home();
</script>
